<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>A Little Something For You ❤️</title>
<style>
:root{--rose:#ff7198;--cream:#fff4f6;--ink:#321c2a}*{box-sizing:border-box}body{margin:0;min-height:100vh;font-family:Georgia,'Times New Roman',serif;color:var(--cream);background:radial-gradient(ellipse at top,#562b48 0,#211522 55%,#100d14 100%);display:flex;align-items:center;justify-content:center;padding:22px;overflow-x:hidden}.card{width:min(100%,520px);padding:34px 25px 28px;text-align:center;border:1px solid #ffffff25;border-radius:28px;background:#ffffff0b;box-shadow:0 20px 80px #0007;backdrop-filter:blur(8px)}.heart{font-size:48px;animation:pulse 1.5s infinite}.eyebrow{font:600 11px Arial,sans-serif;letter-spacing:4px;text-transform:uppercase;color:#ffc1d0;margin-top:8px}h1{font-size:clamp(34px,8vw,48px);font-weight:normal;line-height:1.06;margin:16px 0;color:#fff1f5}p{line-height:1.7;color:#f6dce5;font-size:17px}.name{color:#ff9bb6}.buttons{display:grid;gap:11px;margin-top:24px}.buttons button{border:1px solid #ffb1c8;background:#ff7198;color:#321522;padding:14px 16px;border-radius:14px;font-size:15px;font-weight:bold;cursor:pointer}.buttons button.secondary{background:#ffffff0b;color:#fff0f5;border-color:#ffffff35}.note{display:none;margin-top:20px;padding:18px;border-radius:16px;background:#ffffff0c;border:1px solid #ffffff1a;color:#fff0f5;font-size:17px;line-height:1.7;white-space:pre-line}.note.show{display:block;animation:rise .4s ease}.footer{font:12px Arial,sans-serif;letter-spacing:1px;color:#cba8b7;margin-top:26px}.float{position:fixed;bottom:-40px;pointer-events:none;animation:float 7s linear forwards;opacity:.8}@keyframes pulse{50%{transform:scale(1.12)}}@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}@keyframes float{to{transform:translateY(-110vh) rotate(25deg);opacity:0}}@media(min-width:500px){.card{padding:42px 36px}}
</style></head>
<body><main class="card"><div class="heart">❤️</div><div class="eyebrow">A little something for you</div><h1>For my <span class="name">favorite person</span></h1><p>For the days that feel easy, and the days that don’t. Open this whenever you need a reminder that you’re loved, appreciated, and never alone in this.</p><div class="buttons"><button onclick="reveal('love')">💌 A message from me</button><button class="secondary" onclick="reveal('hard')">🌙 For your darkest days</button><button class="secondary" onclick="reveal('smile')">🥹 One thing I hope you never forget</button><button class="secondary" onclick="reveal('promise')">🤍 A promise</button></div><div id="note" class="note" aria-live="polite"></div><div class="footer">MADE WITH LOVE · JUST FOR YOU</div></main>
<script>
const notes={love:"Mesh haksareek abadan ya hayati. ❤️",hard:"I’m always by your side, baby. No matter how dark things get, you don’t have to face any of it alone. I’m here for you, always. ❤️",smile:"B7beeik ya 8bya. Law el nas kolaha shayfa en feeki 3youb, ana shayef enek a7la wa7da fe nazary. ❤️",promise:"I can’t promise that every day will be easy. I can promise to keep choosing honesty, respect, patience, and effort — and to talk things through instead of leaving you guessing."};
function reveal(key){const n=document.getElementById('note');n.classList.remove('show');n.textContent=notes[key];void n.offsetWidth;n.classList.add('show');for(let i=0;i<5;i++){const h=document.createElement('div');h.className='float';h.textContent=['❤','♡','✨'][Math.floor(Math.random()*3)];h.style.left=(Math.random()*95)+'vw';h.style.fontSize=(16+Math.random()*18)+'px';h.style.animationDuration=(5+Math.random()*4)+'s';document.body.appendChild(h);setTimeout(()=>h.remove(),9500)}}
</script></body></html>
